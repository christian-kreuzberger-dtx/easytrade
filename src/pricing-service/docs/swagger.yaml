definitions:
  price.errorResult:
    properties:
      error:
        type: string
    type: object
  price.price:
    properties:
      close:
        type: number
      high:
        type: number
      id:
        type: integer
      instrumentId:
        type: integer
      low:
        type: number
      open:
        type: number
      timestamp:
        type: string
    type: object
  price.pricesResult:
    properties:
      results:
        items:
          $ref: '#/definitions/price.price'
        type: array
    type: object
info:
  contact: {}
  description: This service provides information about the prices of instruments being
    handled by easyTrade.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Pricing service API
  version: "1.0"
paths:
  /v1/prices/instrument/{instrumentId}:
    get:
      consumes:
      - '*/*'
      description: Get specific number of records of particular instrument
      parameters:
      - description: Instrument id
        in: path
        name: instrumentId
        required: true
        type: integer
      - description: Number of records (1-1000, default 100; values above 1000 are
          capped)
        in: query
        name: records
        type: integer
      produces:
      - application/json
      - application/xml
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/price.pricesResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/price.errorResult'
      summary: Get prices of a particular instrument
      tags:
      - Pricing-service
  /v1/prices/last:
    get:
      consumes:
      - '*/*'
      description: Get last price of instrument
      produces:
      - application/json
      - application/xml
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/price.price'
      summary: Get instrument price
      tags:
      - Pricing-service
  /v1/prices/latest:
    get:
      consumes:
      - '*/*'
      description: Get current price of each instrument
      produces:
      - application/json
      - application/xml
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/price.pricesResult'
      summary: Get instrument prices
      tags:
      - Pricing-service
  /version:
    get:
      consumes:
      - '*/*'
      produces:
      - text/plain
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Get service version
      tags:
      - Pricing-service
schemes:
- http
swagger: "2.0"
